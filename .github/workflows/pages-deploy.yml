name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_EVENT: ${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Submit URLs to IndexNow
        run: |
          SITE_URL=$(grep '^url:' _config.yml | head -1 | awk '{print $2}' | tr -d "'\"")
          HOST="${SITE_URL#*//}"
          KEY="a25e23958b8a4e2e9496a045db70c16d"

          # ── Determine which URLs to submit ──────────────────────────────────
          FULL_SUBMIT=false
          if [ "$GH_EVENT" = "workflow_dispatch" ]; then
            echo "Manual trigger — submitting full sitemap"
            FULL_SUBMIT=true
          elif ! git rev-parse HEAD~1 &>/dev/null; then
            echo "Initial commit — submitting full sitemap"
            FULL_SUBMIT=true
          elif git diff --name-only HEAD~1 HEAD \
              | grep -qE '^(_config\.yml|_layouts/|_includes/|assets/)'; then
            echo "Global change detected — submitting full sitemap"
            FULL_SUBMIT=true
          fi

          if [ "$FULL_SUBMIT" = "true" ]; then
            URL_LIST=$(curl -s --retry 3 --retry-all-errors "$SITE_URL/sitemap.xml" \
              | grep -oP '(?<=<loc>)[^<]+' \
              | head -10000 \
              | jq -R . | jq -sc .)
          else
            echo "Submitting only changed post/page URLs"
            URL_LIST=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^(_posts/.*\.md|_tabs/.*\.md)$' \
              | while read -r f; do
                  case "$f" in
                    _posts/*)
                      SLUG=$(basename "$f" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
                      echo "$SITE_URL/posts/$SLUG/"
                      ;;
                    _tabs/*)
                      TAB=$(basename "$f" .md)
                      echo "$SITE_URL/$TAB/"
                      ;;
                  esac
                done \
              | jq -R . | jq -sc .)
          fi

          URL_COUNT=$(echo "$URL_LIST" | jq 'length')
          echo "URLs to submit: $URL_COUNT"

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "Nothing to submit — skipping"
            exit 0
          fi

          # ── Build JSON payload safely via jq ─────────────────────────────────
          PAYLOAD=$(jq -nc \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "$SITE_URL/$KEY.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          # ── Submit to Bing directly (shows in Webmaster Tools dashboard) ─────
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Response: $HTTP_CODE${BODY:+ — $BODY}"

          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] \
            || { echo "Unexpected response: $HTTP_CODE"; exit 1; }
