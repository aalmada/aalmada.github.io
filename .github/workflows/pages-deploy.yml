name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Submit URLs to IndexNow
        run: |
          SITE_URL=$(grep '^url:' _config.yml | head -1 | awk '{print $2}' | tr -d '"')
          HOST=$(echo "$SITE_URL" | sed 's|https\?://||')
          KEY="a25e23958b8a4e2e9496a045db70c16d"

          # Detect whether global files changed (config, layouts, includes, assets)
          # Fall back to full sitemap if HEAD~1 is unavailable (e.g. first commit)
          GLOBAL=""
          if git rev-parse HEAD~1 &>/dev/null; then
            GLOBAL=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^(_config\.yml|_layouts/|_includes/|assets/)' || true)
          else
            GLOBAL="initial"
          fi

          if [ -n "$GLOBAL" ]; then
            echo "Global change detected — fetching all URLs from sitemap"
            URL_LIST=$(curl -s --retry 3 "$SITE_URL/sitemap.xml" \
              | grep -oP '(?<=<loc>)[^<]+' \
              | jq -R . | jq -sc .)
          else
            echo "Submitting only changed post URLs"
            URL_LIST=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^_posts/.*\.md$' \
              | while read -r f; do
                  SLUG=$(basename "$f" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
                  echo "$SITE_URL/posts/$SLUG/"
                done \
              | jq -R . | jq -sc .)
          fi

          URL_COUNT=$(echo "$URL_LIST" | jq 'length')
          echo "URLs to submit: $URL_COUNT"

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "Nothing to submit — skipping"
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --retry 3 --retry-delay 5 \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"$HOST\",
              \"key\": \"$KEY\",
              \"keyLocation\": \"$SITE_URL/$KEY.txt\",
              \"urlList\": $URL_LIST
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Response: $HTTP_CODE${BODY:+ — $BODY}"

          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ] \
            || { echo "Unexpected response: $HTTP_CODE"; exit 1; }
